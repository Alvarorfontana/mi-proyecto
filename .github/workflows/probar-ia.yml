name: probar-ia
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -w " HTTP %{http_code}\n" "https://mi-proyecto-awgu.vercel.app/api/ia?prov=estado" -H "X-GitHub-Token: ${{ github.token }}"
          curl -s -w " HTTP %{http_code}\n" "https://mi-proyecto-awgu.vercel.app/api/ia?prov=estado" -H "X-GitHub-Token: falso"
          curl -s -o /dev/null -w "js HTTP %{http_code}\n" "https://mi-proyecto-awgu.vercel.app/"
          curl -s "https://mi-proyecto-awgu.vercel.app/" | grep -o 'assets/[^"]*\.js' | head -3
          for d in taller-editorial-vercel-app.vercel.app mi-proyecto-awgu.vercel.app; do curl -s -o /dev/null -w "$d %{http_code}\n" https://$d/; curl -s -w " $d entrar %{http_code}\n" -X POST https://$d/api/entrar; echo; done
