name: probar-ia
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -w " HTTP %{http_code}\n" "https://taller-editorial.vercel.app/api/ia?prov=estado" -H "X-GitHub-Token: ${{ github.token }}"
          curl -s -w " HTTP %{http_code}\n" "https://taller-editorial.vercel.app/api/ia?prov=estado" -H "X-GitHub-Token: falso"
          curl -s -o /dev/null -w "js HTTP %{http_code}\n" "https://taller-editorial.vercel.app/"
          curl -s "https://taller-editorial.vercel.app/" | grep -o 'assets/[^"]*\.js' | head -3
