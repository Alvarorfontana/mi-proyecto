# ── Preliminares ─────────────────────────────────────────────
[preliminares]
portadilla  = true
dedicatoria = "texto/dedicatoria.md"
indice      = "inicio"   # inicio | final | no

# ── Tapa ─────────────────────────────────────────────────────
[tapa]
papel          = "obra-80"   # ver plantilla/presets.toml → [papeles]
cartulina_mm   = 0.6         # suma de las dos tapas al lomo
solapa         = "80mm"      # "0mm" = sin solapas
sangrado       = "3mm"
pliegue_solapa = "3mm"       # margen extra que piden algunas imprentas en el doblez
fondo          = "#1d2a33"
color_texto    = "#f4efe6"
color_acento   = "#d9a441"
imagen         = ""          # ej. "tapa/foto-tapa.jpg" (ocupa toda la tapa)
imagen_contratapa = ""
contratapa     = "tapa/contratapa.md"
solapa_delantera = "tapa/solapa-delantera.md"
solapa_trasera   = "tapa/solapa-trasera.md"
foto_autor     = ""          # ej. "tapa/autor.jpg" (va en la solapa delantera)
